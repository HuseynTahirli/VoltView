<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoltView Analytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=4" />
  <link rel="stylesheet" href="responsive-fixes.css?v=2" />
  <link rel="stylesheet" href="center-fix.css?v=2" />
  <link rel="stylesheet" href="layout-overrides.css?v=2" />
  <link rel="stylesheet" href="ui-improvements.css?v=2" />
  <link rel="stylesheet" href="mobile.css?v=3" />
  <script src="auth-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="mobile-nav.js" defer></script>
  <script src="script.js" defer></script>
  <script src="analytics.js" defer></script>
  <link rel="stylesheet" href="theme-black-silver.css?v=2" />
</head>

<body>
  <canvas id="cyber-bg" class="cyber-bg-canvas"></canvas>
  <header class="ep-topnav">
    <a href="index.html" class="ep-logo-link">
      <span class="ep-logo-svg"><img src="assets/voltviewlogo.png" alt="VoltView" style="height:36px;width:auto;mix-blend-mode:screen;" /></span>
      <span class="ep-logo-text">VoltView</span>
    </a>
    <nav class="ep-navlinks">
      <a href="index.html" class="ep-navbtn">Dashboard</a>
      <a href="analytics.html" class="ep-navbtn active">Analytics</a>
      <a href="live-readings.html" class="ep-navbtn">Live Readings</a>
      <a href="reports.html" class="ep-navbtn">Reports</a>
      <a href="alerts.html" class="ep-navbtn">Alerts</a>
      <a href="settings.html" class="ep-navbtn">Settings</a>
      </nav>
  </header>
  </div>
  <main class="ep-content">
    <div class="ep-analytics-container">
      <!-- METRICS NEON GROUPED CARD -->
      <div class="ep-analytics-metrics-card">
        <div class="ep-analytics-metrics-grid">
          <div class="ep-analytics-metric">
            <div class="ep-analytics-metric-label">Power</div>
            <div class="ep-analytics-metric-value" id="main-power">0 kW</div>
          </div>
          <div class="ep-analytics-metric">
            <div class="ep-analytics-metric-label">Voltage</div>
            <div class="ep-analytics-metric-value" id="main-voltage">0 V</div>
          </div>
          <div class="ep-analytics-metric">
            <div class="ep-analytics-metric-label">Current</div>
            <div class="ep-analytics-metric-value" id="main-current">0 A</div>
          </div>
          <div class="ep-analytics-metric">
            <div class="ep-analytics-metric-label">Today's Energy</div>
            <div class="ep-analytics-metric-value" id="tile-usage">0 kWh</div>
          </div>
          <div class="ep-analytics-metric">
            <div class="ep-analytics-metric-label">Peak Power</div>
            <div class="ep-analytics-metric-value" id="tile-peak">0 kW</div>
          </div>
          <div class="ep-analytics-metric">
            <div class="ep-analytics-metric-label">Avg Voltage</div>
            <div class="ep-analytics-metric-value" id="tile-avgvolt">0 V</div>
          </div>
        </div>
      </div>
      <!-- Centered Two-Column Grid of Chart Cards -->
      <section class="ep-analytics-grid">
        <div class="ep-analytics-card">
          <div class="ep-card-title">Power Over Time <button
              onclick="exportChartToPNG('main-power-chart')">Export</button></div>
          <div class="ep-graph-fixed"><canvas id="main-power-chart" height="175"></canvas></div>
        </div>
        <div class="ep-analytics-card">
          <div class="ep-card-title">Voltage Waveform <button
              onclick="exportChartToPNG('waveform-chart')">Export</button></div>
          <div class="ep-graph-fixed"><canvas id="waveform-chart" height="175"></canvas></div>
        </div>
        <div class="ep-analytics-card">
          <div class="ep-card-title">Device Contribution <button
              onclick="exportChartToPNG('device-chart')">Export</button></div>
          <div class="ep-graph-fixed"><canvas id="device-chart" height="175"></canvas></div>
        </div>
        <div class="ep-analytics-card">
          <div class="ep-card-title">Hourly Usage <button onclick="exportChartToPNG('hourly-chart')">Export</button>
          </div>
          <div class="ep-graph-fixed"><canvas id="hourly-chart" height="175"></canvas></div>
        </div>
        <div class="ep-analytics-card">
          <div class="ep-card-title">Min/Max Voltage <button
              onclick="exportChartToPNG('minmax-voltage-chart')">Export</button></div>
          <div class="ep-graph-fixed"><canvas id="minmax-voltage-chart" height="175"></canvas></div>
        </div>
        <div class="ep-analytics-card">
          <div class="ep-card-title">Power Factor <button onclick="exportChartToPNG('pf-chart')">Export</button></div>
          <div class="ep-graph-fixed"><canvas id="pf-chart" height="175"></canvas></div>
        </div>
      </section>
      <footer class="ep-footer">VoltView Analytics &copy; 2025</footer>
          </div>
  </main>
  </main>
</body>

</html>
