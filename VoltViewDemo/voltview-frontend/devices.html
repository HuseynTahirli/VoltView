<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoltView Devices</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=4" />
  <link rel="stylesheet" href="responsive-fixes.css?v=2" />
  <link rel="stylesheet" href="center-fix.css?v=2" />
  <link rel="stylesheet" href="layout-overrides.css?v=2" />
  <link rel="stylesheet" href="ui-improvements.css?v=2" />
  <link rel="stylesheet" href="mobile.css?v=3" />
  <script src="script.js" defer></script>
  <script src="mobile-nav.js" defer></script>
  <link rel="stylesheet" href="theme-black-silver.css?v=2" />
</head>

<body>
  <header class="ep-topnav">
    <a href="index.html" class="ep-logo-link">
      <span class="ep-logo-svg"><img src="assets/voltviewlogo.png" alt="VoltView" style="height:36px;width:auto;mix-blend-mode:screen;" /></span>
      <span class="ep-logo-text">VoltView</span>
    </a>
    <nav class="ep-navlinks">
      <a href="index.html" class="ep-navbtn">Dashboard</a>
      <a href="analytics.html" class="ep-navbtn">Analytics</a>
      <a href="live-readings.html" class="ep-navbtn">Live Readings</a>
      <a href="reports.html" class="ep-navbtn">Reports</a>
      <a href="alerts.html" class="ep-navbtn">Alerts</a>
      <a href="settings.html" class="ep-navbtn">Settings</a>
      </nav>
    <script src="auth-api.js"></script>
    <script src="devices-api.js" defer></script>
  </header>
  </div>
  <main class="ep-content">
    <div class="ep-table-section-neon">
      <div class="ep-table-title-neon">Connected Devices</div>
      <div id="ep-devices-table-outer">
        <table class="ep-table" id="ep-devices-table">
          <thead>
            <tr>
              <th class="ep-table-icon-col"></th>
              <th class="ep-table-name-col">Name</th>
              <th class="ep-table-status-col">Status</th>
              <th class="ep-table-type-col">Type</th>
              <th class="ep-table-watts-col">Watts</th>
            </tr>
          </thead>
          <tbody id="ep-device-tbody"></tbody>
          <tfoot>
            <tr class="ep-total-row">
              <td colspan="4"
                style="text-align:right;padding-right:2.3em;font-size:1.06em;opacity:.98;color:#11fee7;font-weight:700;letter-spacing:.04em;border-top:2.2px solid #5ff1e881;background:rgba(0,255,247,0.04)">
                Total power draw:</td>
              <td id="ep-devices-total"
                style="color:#fff;font-weight:900;font-size:1.16em;text-shadow:0 0 13px #00ffd7c9;">… W</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof populateDeviceTable === 'function') {
        populateDeviceTable();
        setInterval(populateDeviceTable, 3000); // Live updates
      }
    });
  </script>
</body>

</html>
